<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'none'">
  <title>LabLog</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="LabLog">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/day"><img src="favicon.svg" alt="" width="22" height="22">LabLog</a>
      <div id="status" class="status" aria-live="polite"></div>
      <nav class="tabs" aria-label="表示の切り替え">
        <a href="#/day" data-tab="day">日別</a>
        <a href="#/month" data-tab="month">月</a>
        <a href="#/settings" data-tab="settings">設定</a>
      </nav>
      <button id="pause" class="btn btn-ghost" type="button"></button>
    </div>
  </header>
  <div id="notices" class="wrap"></div>
  <main id="view" class="wrap"></main>
  <footer id="foot" class="wrap foot"></footer>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <script src="config.js"></script>
  <script src="cloud.js"></script>
  <script src="app.js"></script>
</body>
</html>
